<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Marcos Paz</title>
  <link rel="stylesheet" href="style.css">

  <!-- 1. Carga del SDK oficial de Supabase desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Encabezado / Navbar -->
  <header class="header">
    <div class="header-container">
      <h1>Directorio de Marcos Paz</h1>
      <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main-container">
    <h2>Lista de Docentes y Profesionales registrados</h2>

    <!-- Contenedor donde se cargarán los datos de Supabase -->
    <div id="content-card" class="card">
      <p id="loading-text">Cargando datos desde Supabase...</p>
      <ul id="teachers-list" class="teachers-list"></ul>
    </div>
  </main>

  <!-- 2. Carga del script principal como módulo ES6 -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
